name: discover-videos

on:
  schedule:
    - cron: '0 0,5,10,15,20 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 신규 영상 발견
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/discover.js
      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/tracked.json
          git diff --cached --quiet || git commit -m "discover: 신규 영상 추가 [skip ci]"
          git push
